{{- if and .Values.persistence.data.enabled .Values.persistence.backups.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup-snapshot
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/component: backup-snapshot
spec:
  schedule: "0 1 * * *"
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 14
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}-backup-snapshot
            app.kubernetes.io/name: {{ .Chart.Name }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
            app.kubernetes.io/managed-by: {{ .Release.Service }}
            helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" }}
            app.kubernetes.io/component: backup-snapshot
        spec:
          restartPolicy: OnFailure
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: backup-snapshot
              image: {{ include "rag-support-assistant.image" . | quote }}
              command:
                - python
                - scripts/backup_snapshot.py
                - --output-dir
                - /backups
              env:
                # Explicit backup contract: map Secret DATABASE_URL → POSTGRES_URL
                # so the snapshot runtime always sees a Postgres DSN (chart-managed
                # or secrets.existingSecret). Never put the DSN in command args.
                - name: POSTGRES_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Release.Name) }}
                      key: DATABASE_URL
                - name: BACKUP_ENCRYPTION_ENABLED
                  value: {{ .Values.backup.encryption.enabled | quote }}
                {{- if .Values.backup.encryption.enabled }}
                - name: BACKUP_ENCRYPTION_RECIPIENT_FILE
                  value: /secrets/recipient.pub
                {{- end }}
              envFrom:
                {{- include "rag-support-assistant.envFrom" . | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /app/data
                  readOnly: true
                - name: backups
                  mountPath: /backups
                {{- if .Values.backup.encryption.enabled }}
                - name: backup-encryption-key
                  mountPath: /secrets
                  readOnly: true
                {{- end }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "rag-support-assistant.dataClaimName" . }}
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "rag-support-assistant.backupsClaimName" . }}
            {{- if .Values.backup.encryption.enabled }}
            - name: backup-encryption-key
              secret:
                secretName: backup-encryption-key
            {{- end }}
{{- end }}
