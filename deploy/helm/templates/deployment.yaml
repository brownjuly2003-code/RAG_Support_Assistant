{{- if and (eq (default "" .Values.env.RAG_ENV) "production") (not .Values.persistence.data.enabled) }}
{{- fail "Helm: persistence.data.enabled must be true when env.RAG_ENV=production (authoritative /app/data tree: uploads, Chroma, SQLite traces). Enable data persistence or set env.RAG_ENV to a non-production value." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/component: app
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: {{ include "rag-support-assistant.image" . | quote }}
          ports:
            - containerPort: 8000
          envFrom:
            {{- include "rag-support-assistant.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if .Values.persistence.data.enabled }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os
                  import pathlib
                  import urllib.request
                  data = pathlib.Path("/app/data")
                  if not os.path.ismount(str(data)):
                      raise SystemExit("/app/data is not a mounted volume")
                  probe = data / ".helm-readiness-probe"
                  probe.write_text("ok", encoding="utf-8")
                  probe.unlink()
                  urllib.request.urlopen("http://127.0.0.1:8000/api/health/ready", timeout=2)
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 2
          {{- else }}
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 2
          {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      {{- if .Values.persistence.data.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "rag-support-assistant.dataClaimName" . }}
      {{- end }}
