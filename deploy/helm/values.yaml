# Single replica by design. Session history, pending confirm-actions, the
# LLM/retriever caches and the circuit breaker are in-process and NOT shared
# across replicas/workers, so >1 replica breaks confirm-action flows and
# session continuity. Do NOT raise this (and keep autoscaling disabled) until
# that state moves to Redis/Postgres. See README "Deployment topology".
replicaCount: 1

image:
  repository: rag-support-assistant
  # Tag defaults to Chart.appVersion when empty (see _helpers.tpl).
  # Override per-environment via --set image.tag=<version>.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: support.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# Disabled until session/confirm-action state is externalised (see replicaCount
# note). The HPA would otherwise scale to multiple in-process-state replicas.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70

# Public, non-sensitive env. Goes into ConfigMap, visible via `kubectl get configmap`.
# RAG_ENV=production triggers Settings.validate() in api/app.py lifespan, which
# rejects "*" CORS origins. CORS_ORIGINS is intentionally absent from defaults
# so the chart aborts via templates/configmap.yaml when production mode is on
# but the operator forgot to set it. Provide it via:
#   --set env.CORS_ORIGINS="https://app.example.com,https://admin.example.com"
env:
  RAG_ENV: "production"
  OLLAMA_BASE_URL: "http://ollama:11434"
  REDIS_URL: "redis://redis:6379/0"
  REQUIRE_OLLAMA: "true"
  RAG_SEMANTIC_CHUNKING: "true"
  OTEL_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_SERVICE_NAME: "rag-support-assistant"

# Sensitive env. Rendered as Kubernetes Secret. Required keys:
#   DATABASE_URL, JWT_SECRET, SESSION_SECRET_KEY, ADMIN_PASSWORD_HASH, DB_ENCRYPTION_KEY
# To use a pre-provisioned Secret instead, set `secrets.existingSecret: <name>`
# and leave the other keys empty — secret.yaml will not be rendered.
secrets:
  existingSecret: ""
  DATABASE_URL: ""
  JWT_SECRET: ""
  SESSION_SECRET_KEY: ""
  ADMIN_PASSWORD_HASH: ""
  DB_ENCRYPTION_KEY: ""
  # Optional — only added to Secret when non-empty.
  MISTRAL_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  SMTP_PASSWORD: ""
  IMAP_PASSWORD: ""
  EMAIL_WEBHOOK_SIGNING_SECRET: ""
  POSTGRES_PASSWORD: ""

postgresql:
  enabled: true
  auth:
    database: rag_assistant
    username: rag
    # Set via --set postgresql.auth.password=... or provide existingSecret to
    # the Bitnami Postgres chart. No default — install will fail until set.
    password: ""

redis:
  enabled: true

otel:
  enabled: false
  endpoint: "http://otel-collector:4317"

ollama:
  enabled: true
  model: "qwen2.5:7b"
  resources:
    limits:
      nvidia.com/gpu: 1

backup:
  encryption:
    enabled: false

# Durable stores for the authoritative /app/data tree (uploads, Chroma, SQLite
# traces), backup snapshots, and ops reports. Production requires data
# persistence (see templates/deployment.yaml). Use existingClaim to bind a
# pre-provisioned PVC; leave empty to create a chart-managed claim.
persistence:
  data:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  backups:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  reports:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi

# Pod-level security. Do not invent runAsUser: the image runs as Debian's
# system `app` user without a stable UID contract. fsGroup makes PVC mounts
# group-writable; Kubernetes adds it as a supplementary group.
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Container-level security. readOnlyRootFilesystem stays off until every
# required writable path is an explicit mount.
containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Celery ingestion worker (sidecar in the app pod by default). Shares the
# ReadWriteOnce /app/data PVC with the Uvicorn web container. Keep
# concurrency=1 and replicaCount=1 until per-tenant locking and atomic index
# publish exist. Disabling the worker leaves the app Deployment contract
# intact; non-production data-disabled renders require worker.enabled=false.
worker:
  enabled: true
  concurrency: 1
  logLevel: info
  # Long warm-shutdown: no Celery task_time_limit is configured in-repo, and
  # embedding/indexing a large document can run for many minutes.
  terminationGracePeriodSeconds: 3600
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 3
